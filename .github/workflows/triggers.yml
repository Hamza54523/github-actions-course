
name: Workflow Triggers Demo

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  trigger-demo:
    runs-on: ubuntu-latest
    steps:
      - name: Show event
        env:
          EVENT_NAME: ${{ github.event_name }}
        run: 'echo "Event name: $EVENT_NAME"'

      - name: Show user
        env:
          ACTOR: ${{ github.actor }}
        run: 'echo "Triggered by: $ACTOR"'

      - name: Show message
        run: 'echo "Pull request trigger test"'
