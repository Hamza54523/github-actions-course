
name: Variables and Secrets Demo

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  variables-secrets-demo:
    runs-on: ubuntu-latest

    steps:
      - name: Display repository variable
        env:
          DEMO_MESSAGE: ${{ vars.DEMO_MESSAGE }}
        run: |
          echo "Repository variable: $DEMO_MESSAGE"

      - name: Check repository secret
        env:
          MY_SECRET: ${{ secrets.MY_SECRET }}
        run: |
          if [ -n "$MY_SECRET" ]; then
            echo "MY_SECRET is configured."
            echo "Secret value (GitHub masks it): $MY_SECRET"
          else
            echo "MY_SECRET is missing."
            exit 1
          fi

      - name: Test automatic GitHub token
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          RESPONSE=$(curl -sS \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/$GITHUB_REPOSITORY")

          echo "$RESPONSE" | jq -r '"Repository: " + .full_name'
