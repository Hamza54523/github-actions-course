
name: Module 7 - Use Custom JavaScript Action

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  test-custom-action:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout course repository
        uses: actions/checkout@v4

      - name: Run my custom JavaScript action
        id: custom-action
        uses: Hamza54523/hello-javascript-action@v1.0.0
        with:
          who-to-greet: "GitHub Actions Student"

      - name: Display action output
        run: echo "Action ran at ${{ steps.custom-action.outputs.time }}"
